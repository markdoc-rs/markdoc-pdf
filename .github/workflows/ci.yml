# CI for markdoc-pdf
#
# Runs fmt, clippy, tests and a release build on every push and PR against
# `main`.
#
# The crate depends on `markdoc`, `flux-types` and `markdoc-mermaid` through
# relative paths (`path = "../markdoc"`), and those are separate repositories,
# so each job checks all three out side-by-side under the workspace root
# before running cargo from inside `markdoc-pdf/`.
#
# Those siblings are taken from this repo's own owner (the
# `${{ github.repository_owner }}` substitution) with one exception:
# flux-types, which is still under a different org. See the note on its step.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out markdoc-pdf
        uses: actions/checkout@v4
        with:
          path: markdoc-pdf

      - name: Check out sibling — markdoc
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/markdoc
          path: markdoc

      # Owner hardcoded, unlike the siblings above. flux-types has not moved
      # to the markdoc-rs org, so `github.repository_owner` resolves it to
      # `markdoc-rs/flux-types`, which does not exist -- and a missing repo and
      # a private one are the same 404 from the API, so the failure reads as
      # "Not Found" with nothing to say which.
      - name: Check out sibling — flux-types
        uses: actions/checkout@v4
        with:
          repository: EntSP/flux-types
          path: flux-types

      # Needed even though `mermaid` is off by default: cargo resolves a path
      # dependency's location while reading the manifest, before it decides
      # which features are on, so an absent `../markdoc-mermaid` fails the
      # build outright rather than being skipped.
      - name: Check out sibling — markdoc-mermaid
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/markdoc-mermaid
          path: markdoc-mermaid

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # fonts-liberation: the per-element font tests need two distinct
          # installed families to tell elements apart. macOS and Windows
          # ship suitable ones; don't rely on the Linux runner's defaults.
          sudo apt-get install -y libfontconfig1-dev fonts-liberation

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: markdoc-pdf
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        working-directory: markdoc-pdf
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: markdoc-pdf
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: markdoc-pdf
        run: cargo test --all-targets

      - name: cargo build --release
        working-directory: markdoc-pdf
        run: cargo build --release --bin markdoc-pdf

      - name: Smoke-test the binary
        working-directory: markdoc-pdf
        shell: bash
        run: |
          ./target/release/markdoc-pdf \
              --input examples/rich.mdoc \
              --output rich.pdf \
              --style examples/themes/letter.style.toml \
              --assets-root examples
          test -s rich.pdf
