[package]
name = "markdoc-pdf"
version = "0.11.3"
edition = "2024"
license = "MIT"
description = "Render Markdoc documents to PDF, as a CLI or a library"
repository = "https://github.com/markdoc-rs/markdoc-pdf"

[lib]
name = "markdoc_pdf"
path = "src/lib.rs"

[[bin]]
name = "markdoc-pdf"
path = "src/main.rs"

[features]
# On by default, because the content repository writes diagrams and a build
# without the feature prints every ```mermaid fence as its source, without
# a word. A consumer that never writes one can leave out the engine and its
# font-matching and parsing stack with `--no-default-features`.
default = ["mermaid"]
mermaid = ["dep:markdoc-mermaid"]

[dependencies]
markdoc    = "0.1.0"
markdoc-mermaid = { version = "0.3.0", optional = true }

# PDF / layout stack — these used to be `*.workspace = true` against
# the markdoc workspace. Now standalone: pin the same versions
# inline. Keep these in lockstep with leptos-markdoc when shared.
krilla     = "0.8"
krilla-svg = "0.8"
parley     = "0.11"
usvg       = "0.47"   # pinned to match krilla-svg 0.8's internal usvg

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = "1.1"
clap       = { version = "4.6", features = ["derive"] }
thiserror  = "2.0"
time       = { version = "0.3", default-features = false, features = ["std", "local-offset", "parsing", "macros"] }
ureq       = { version = "3", default-features = false, features = ["rustls"] }
hyphenation = { version = "0.8", default-features = false, features = ["embed_en-us"] }
qrcodegen = "1.8.0"
